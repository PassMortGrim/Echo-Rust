name: Docker (multi-arch + GHCR)

# Dernière étape de la roadmap : images multi-architecture (amd64 + arm64)
# publiées sur GHCR (ghcr.io/<owner>/echo-rust).
#
# - pull_request : build amd64 SEULEMENT (vite, jamais de push) ;
# - push sur main / tags v* / manuel : build amd64 + arm64 (QEMU) et push GHCR.
#
# ⚠ macOS du build arm64 : la compilation Rust sous QEMU est lente
# (30-60 min au 1er run, ensuite le cache GHA par plateforme accélère).

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-publish:
    name: buildx amd64/arm64
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: read
      packages: write # publication GHCR

    steps:
      - uses: actions/checkout@v7

      # Émulation arm64 pour le build multi-arch.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Connexion GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Métadonnées (tags/labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha

      - name: Build (+ push sur main/tags)
        uses: docker/build-push-action@v6
        with:
          context: .
          # PR : amd64 uniquement (rapide) — publication : amd64 + arm64.
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
