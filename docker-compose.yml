services:
  echo-rust:
    build:
      context: .
      dockerfile: Dockerfile
    image: echo-rust:0.2.0
    env_file:
      - .env
    environment:
      ECHO_LLM__API_KEY: ${ECHO_LLM__API_KEY}
      ECHO_NEO4J__URI: bolt://neo4j:7687
      ECHO_NEO4J__USER: neo4j
      ECHO_NEO4J__PASSWORD: ${NEO4J_PASSWORD}
      ECHO_VECTOR_DB__BACKEND: ${ECHO_VECTOR_DB__BACKEND:-sqlite}
      ECHO_VECTOR_DB__QDRANT_URL: http://qdrant:6333
    depends_on:
      neo4j:
        condition: service_healthy
      qdrant:
        condition: service_started
    volumes:
      - echo-data:/home/echo/data
    # Décommente uniquement si Echo-Rust doit créer ses propres conteneurs :
    # - /var/run/docker.sock:/var/run/docker.sock
    stdin_open: true
    tty: true

  neo4j:
    image: neo4j:5
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD}
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage

volumes:
  echo-data:
  neo4j-data:
  qdrant-data: