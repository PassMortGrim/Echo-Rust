# ═══════════════════════════════════════════
#  Echo-Rust — Example configuration
#  Copy this file to config.toml and
#  fill in the sensitive values.
///
#  Echo-Rust — Configuration d'exemple
#  Copiez ce fichier vers config.toml et
#  remplissez les valeurs sensibles.
# ═══════════════════════════════════════════

[neo4j]
uri      = "bolt://localhost:7687"
user     = "neo4j"
password = "change_me"

[docker]
sandbox_image = "python:3.11-slim"
network_mode  = "none"
memory_limit  = "512m"
cpu_limit     = 1.0

[wasm]
enabled    = true
max_memory = 536870912      # 512 MB
timeout_ms = 30000

[llm]
api_key     = ""           # NEVER commit a key — set ECHO_LLM__API_KEY env var
///
# JAMAIS de clé API committée — exportez ECHO_LLM__API_KEY à la place :
#   PowerShell : $env:ECHO_LLM__API_KEY = "sk-..."
#   bash       : export ECHO_LLM__API_KEY="sk-..."
base_url         = "https://api.openai.com/v1"   # ou LM Studio : http://localhost:1234/v1
model            = "gpt-4-turbo-preview"
embeddings_model = ""         # ex. "nomic-embed-text" (LM Studio) ; vide = fallback hash
# Endpoint embeddings : {base_url} + /embeddings (même client HTTP, même clé)
temperature = 0.2
max_tokens  = 4096

[vector_db]
backend       = "sqlite"    # "sqlite" (défaut) | "qdrant" | "off"
qdrant_url    = "http://localhost:6333"
sqlite_path   = "echo_vectors.db"
embedding_dim = 384         # dimension du FALLBACK hash uniquement ;
                            # la dimension API est auto-détectée et persistée
                            # en métadonnées (vector_meta) au 1er appel.
batch_size    = 32          # chunks par appel /embeddings (batching)
top_k         = 5           # résultats renvoyés par la recherche RAG

[sandbox]
mode            = "wasm"    # "wasm" | "docker"
max_retries     = 3
timeout_seconds = 60

[agent]
max_iterations      = 5
enable_self_healing = true
enable_hybrid_rag   = true
parallel_workers    = 4